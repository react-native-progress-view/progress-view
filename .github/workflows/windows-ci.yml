name: Windows CI
on: [pull_request]

jobs:
  run-windows-tests:
    name: Build & run tests
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      name: Checkout Code

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: "[17.0,18.0)"

    - name: Install node modules
      run: yarn install --immutable

    - name: Bundle example app for Windows
      run: npx react-native bundle --entry-file index.js --platform windows --dev true --bundle-output example/dist/main.windows.bundle --assets-dest example/dist/assets

    # Generates example/windows/ProgressViewExample.sln and autolinks it.
    # Building the solution is tracked in #66.
    - name: Generate Windows App
      run: npx install-windows-test-app --project-directory example/windows
