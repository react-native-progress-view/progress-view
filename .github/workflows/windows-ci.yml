name: Windows CI
on: [pull_request]

jobs:
  run-windows-tests:
    name: Build & run tests
    runs-on: windows-2022
    strategy:
      matrix:
        node-version: [22]

    steps:
    - uses: actions/checkout@v4
      name: Checkout Code

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: "[17.0,18.0)"

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Check node modules cache
      uses: actions/cache@v4
      id: yarn-cache
      with:
        path: ./node_modules
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
    - name: Install node modules
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: yarn --pure-lockfile

    # Always install: example/node_modules holds a copy of this library ("../"),
    # which must reflect the PR rather than a cached copy.
    - name: Install example node modules
      run: cd example && yarn

    - name: Build Windows
      run: cd example && yarn build:windows

    # react-native-test-app 2.x spawns npx.cmd without `shell: true`, which
    # Node >= 18.20.2 rejects with EINVAL (CVE-2024-27980), so autolink separately.
    - name: Generate Windows App
      run: cd example && npx install-windows-test-app --use-nuget --no-autolink

    - name: Autolink Windows App
      run: cd example && npx react-native autolink-windows --proj node_modules/.generated/windows/ReactTestApp/ReactTestApp.vcxproj
     
